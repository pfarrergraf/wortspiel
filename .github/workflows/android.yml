name: Android package

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'frontend/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'frontend/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci --prefix frontend
      - run: npm ci --prefix mobile
      - run: npm run sync --prefix mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug bundleRelease lintDebug testDebugUnitTest --no-daemon
        working-directory: mobile/android
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.36.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd mobile/android && ./gradlew connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Android/data/io.github.pfarrergraf.ludeverbis/files/screenshots ../../docs/play-store/assets/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ludeverbis-android-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/reports/lint-results-debug.html
            mobile/android/app/build/reports/androidTests/connected/
            docs/play-store/assets/screenshots/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-failure-${{ github.sha }}
          path: mobile/android/app/build/reports/
